<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 420" fill="none">
  <rect width="630" height="420" fill="#f8f9fa"/>
  <!-- Car body — long, van-like MUV shape -->
  <rect x="70" y="215" width="490" height="115" rx="10" fill="#d1d5db"/>
  <!-- Roof (MUV — long flat top) -->
  <path d="M140 215 L165 145 L510 140 L540 215 Z" fill="#9ca3af"/>
  <!-- Wheels -->
  <circle cx="195" cy="335" r="44" fill="#374151"/>
  <circle cx="195" cy="335" r="22" fill="#9ca3af"/>
  <circle cx="460" cy="335" r="44" fill="#374151"/>
  <circle cx="460" cy="335" r="22" fill="#9ca3af"/>
  <!-- Windows (3 rows) -->
  <rect x="185" y="158" width="110" height="52" rx="4" fill="#bfdbfe" opacity="0.7"/>
  <rect x="305" y="158" width="110" height="52" rx="4" fill="#bfdbfe" opacity="0.6"/>
  <rect x="425" y="158" width="80" height="52" rx="4" fill="#bfdbfe" opacity="0.5"/>
  <!-- Headlight -->
  <rect x="72" y="242" width="44" height="22" rx="4" fill="#fef3c7"/>
  <!-- 7-seat badge -->
  <rect x="480" y="230" width="60" height="24" rx="4" fill="#1a1a2e"/>
  <text x="510" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold">7 Seats</text>
  <!-- Text label -->
  <text x="315" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6b7280">MUV / MPV</text>
</svg>
