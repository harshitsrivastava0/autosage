<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 420" fill="none">
  <rect width="630" height="420" fill="#f8f9fa"/>
  <!-- Car body — taller, boxier SUV shape -->
  <rect x="90" y="220" width="450" height="110" rx="10" fill="#d1d5db"/>
  <!-- Roof (SUV — high, squarish) -->
  <path d="M160 220 L185 145 L450 140 L490 220 Z" fill="#9ca3af"/>
  <!-- Wheels — larger -->
  <circle cx="200" cy="335" r="48" fill="#374151"/>
  <circle cx="200" cy="335" r="24" fill="#9ca3af"/>
  <circle cx="455" cy="335" r="48" fill="#374151"/>
  <circle cx="455" cy="335" r="24" fill="#9ca3af"/>
  <!-- Windows -->
  <path d="M193 215 L212 152 L445 147 L462 215 Z" fill="#bfdbfe" opacity="0.7"/>
  <!-- Headlight -->
  <rect x="92" y="248" width="44" height="22" rx="4" fill="#fef3c7"/>
  <!-- Roof rail detail -->
  <rect x="180" y="138" width="275" height="6" rx="3" fill="#6b7280"/>
  <!-- Text label -->
  <text x="315" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6b7280">SUV</text>
</svg>
